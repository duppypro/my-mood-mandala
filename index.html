<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>My Mood Mandala</title>
  </head>
  <body>
    <div id="app" class="flex flex-col h-[100dvh] w-full bg-[#5E4861] text-[#F4F1EA] overflow-hidden font-serif relative">
      <!-- Header Navigation -->
      <header class="flex justify-between items-center px-6 md:px-12 py-6 md:py-8 z-10 relative pointer-events-none">
        <div class="flex flex-col pointer-events-auto">
          <h1 class="text-2xl md:text-3xl font-light tracking-widest text-[#FFF] uppercase">My Mood Mandala</h1>
          <div id="symmetry-selector" class="flex items-center space-x-2 mt-2 pointer-events-auto">
            <button data-symmetry="12-kaleido" class="symmetry-btn p-1.5 rounded-full transition-all ring-2 ring-[#F4F1EA] bg-[#F4F1EA]/10" title="12-Fold Mirrored">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" class="stroke-[#F4F1EA]" stroke-width="1">
                <circle cx="12" cy="12" r="10" />
                <line x1="2" y1="12" x2="22" y2="12" />
                <line x1="17" y1="3.34" x2="7" y2="20.66" />
                <line x1="7" y1="3.34" x2="17" y2="20.66" />
                <line x1="12" y1="2" x2="12" y2="22" stroke-dasharray="2 2" />
                <line x1="20.66" y1="17" x2="3.34" y2="7" stroke-dasharray="2 2" />
                <line x1="3.34" y1="17" x2="20.66" y2="7" stroke-dasharray="2 2" />
              </svg>
            </button>
            <button data-symmetry="6-fold" class="symmetry-btn p-1.5 rounded-full transition-all ring-2 ring-transparent opacity-50 hover:bg-[#F4F1EA]/10" title="6-Fold Standard">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" class="stroke-[#F4F1EA]" stroke-width="1">
                <circle cx="12" cy="12" r="10" />
                <line x1="2" y1="12" x2="22" y2="12" />
                <line x1="17" y1="3.34" x2="7" y2="20.66" />
                <line x1="7" y1="3.34" x2="17" y2="20.66" />
              </svg>
            </button>
          </div>
        </div>
        <div class="flex flex-col items-end gap-2 md:gap-3 pointer-events-auto">
          <div class="flex items-center gap-3">
            <div id="live-indicator" class="flex items-center space-x-2 text-[8px] md:text-[10px] uppercase tracking-widest transition-opacity duration-500 opacity-0">
              <span class="relative flex h-2 w-2">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2 w-2 bg-green-600"></span>
              </span>
              <span class="hidden md:inline">Connected to RTDB</span>
              <span class="md:hidden">Live</span>
            </div>
          </div>
          <button id="btn-share" class="flex items-center space-x-2 bg-[#F4F1EA] text-[#5E4861] px-4 py-2 md:px-5 md:py-2 rounded-full text-[8px] md:text-[10px] uppercase tracking-widest font-bold hover:bg-[#FFF] transition-colors shadow-[0_1px_2px_rgba(0,0,0,0.1)]">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="hidden md:block"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
            <span>Share</span>
          </button>
          <button id="btn-auth" class="flex items-center space-x-2 px-3 py-1.5 md:px-4 md:py-2 border border-[#F4F1EA]/20 bg-[#6D5571] rounded-full text-[8px] md:text-[10px] uppercase tracking-widest hover:bg-[#806784] focus:ring-2 focus:ring-[#F4F1EA] transition-all duration-300 text-[#F4F1EA] font-medium shadow-[0_1px_2px_rgba(0,0,0,0.05)]">
            <svg class="w-3.5 h-3.5 md:w-4 md:h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/><path d="M1 1h22v22H1z" fill="none"/></svg>
            <span>Sign in to save</span>
          </button>
        </div>
      </header>

      <!-- Main Mandala Workspace -->
      <main id="canvas-container" class="relative flex-1 flex items-center justify-center">
        <!-- Subtle Sand Grain Texture Overlay -->
        <div class="absolute inset-0 pointer-events-none opacity-[0.03] mix-blend-multiply bg-[url('https://www.transparenttextures.com/patterns/sandpaper.png')] z-50"></div>
        
        <!-- Share Notification -->
        <div id="share-toast" class="absolute left-1/2 top-24 md:top-10 -translate-x-1/2 bg-[#F4F1EA] text-[#5E4861] px-6 py-3 rounded-full text-[10px] md:text-xs uppercase tracking-widest font-bold shadow-lg opacity-0 pointer-events-none z-50">
          Link copied to clipboard
        </div>

        <!-- Keyboard Shortcuts Overlay (Right) -->
        <div class="hidden lg:flex absolute right-12 top-1/2 -translate-y-1/2 flex-col space-y-4 opacity-40 text-[10px] tracking-widest uppercase items-end pointer-events-none z-10 text-right">
          <div class="flex flex-col">
            <span class="font-bold">W A S D</span>
            <span>Pan Canvas</span>
          </div>
          <div class="flex flex-col">
            <span class="font-bold">Q E</span>
            <span>Rotate View</span>
          </div>
          <div class="flex flex-col">
            <span class="font-bold">Scroll</span>
            <span>Zoom</span>
          </div>
        </div>

        <!-- The Mandala Workspace Canvas -->
        <canvas id="mandala-canvas" class="absolute inset-0 w-full h-full touch-none z-10"></canvas>
      </main>

      <!-- Footer Controls -->
      <footer class="px-6 md:px-12 py-6 md:py-8 flex justify-between items-end z-10 relative pointer-events-none w-full">
        <!-- Mandala Stage Navigation (Lower Left) -->
        <div id="mandala-selectors" class="flex flex-col items-start space-y-3 pointer-events-auto font-serif text-left">
          <button data-target="now" class="selector-btn group flex items-center justify-start transition-all">
            <div class="active-indicator w-1.5 h-1.5 rounded-full bg-[#F4F1EA] mr-2 md:mr-3 transition-opacity"></div>
            <span class="text-sm md:text-lg tracking-widest opacity-100 font-normal transition-all group-hover:opacity-100 uppercase">Now</span>
          </button>
          <button data-target="day" class="selector-btn group flex items-center justify-start transition-all">
            <div class="active-indicator w-1.5 h-1.5 rounded-full bg-[#F4F1EA] mr-2 md:mr-3 opacity-0 transition-opacity"></div>
            <span class="text-sm md:text-lg tracking-widest opacity-30 font-light transition-all group-hover:opacity-100 uppercase">Day</span>
          </button>
          <button data-target="week" class="selector-btn group flex items-center justify-start transition-all">
            <div class="active-indicator w-1.5 h-1.5 rounded-full bg-[#F4F1EA] mr-2 md:mr-3 opacity-0 transition-opacity"></div>
            <span class="text-sm md:text-lg tracking-widest opacity-30 font-light transition-all group-hover:opacity-100 uppercase">Week</span>
          </button>
        </div>

        <!-- Color Palette (Lower Right) -->
        <div id="swatches" class="flex flex-col items-end space-y-2 pointer-events-auto">
          <!-- Top Row (1) -->
          <div class="flex justify-end space-x-2">
            <button data-color="#000000" class="w-5 h-5 md:w-6 md:h-6 rounded-full bg-[#000000] border-2 border-white shadow-sm ring-2 ring-transparent ring-offset-[#5E4861] ring-offset-2 transition-all cursor-pointer"></button>
          </div>
          <!-- Middle Row (2) -->
          <div class="flex justify-end space-x-2">
            <button data-color="#F9A825" class="w-5 h-5 md:w-6 md:h-6 rounded-full bg-[#F9A825] border-2 border-white shadow-sm ring-2 ring-transparent ring-offset-[#5E4861] ring-offset-2 transition-all cursor-pointer"></button>
            <button data-color="#2E7D32" class="w-5 h-5 md:w-6 md:h-6 rounded-full bg-[#2E7D32] border-2 border-white shadow-sm ring-2 ring-transparent ring-offset-[#5E4861] ring-offset-2 transition-all cursor-pointer"></button>
          </div>
          <!-- Bottom Row (3) -->
          <div class="flex justify-end space-x-2">
            <button data-color="#D32F2F" class="w-5 h-5 md:w-6 md:h-6 rounded-full bg-[#D32F2F] border-2 border-white shadow-sm ring-2 ring-transparent ring-offset-[#5E4861] ring-offset-2 transition-all cursor-pointer"></button>
            <button data-color="#FFFFFF" class="w-5 h-5 md:w-6 md:h-6 rounded-full bg-[#FFFFFF] border-2 border-[#F4F1EA]/20 shadow-sm ring-2 ring-transparent ring-offset-[#5E4861] ring-offset-2 transition-all cursor-pointer"></button>
            <button data-color="#0047AB" class="w-5 h-5 md:w-6 md:h-6 rounded-full bg-[#0047AB] border-2 border-white shadow-sm ring-2 ring-transparent ring-offset-[#5E4861] ring-offset-2 transition-all cursor-pointer"></button>
          </div>
        </div>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
